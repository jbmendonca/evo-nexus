services:
  # Dashboard — Flask + React (single container)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.swarm.dashboard
    container_name: evonexus-dashboard
    ports:
      - "8081:8080"
      - "32352:32352"
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - EVONEXUS_PORT=8080
      - TERMINAL_SERVER_PORT=32352
      - CISS_DW_DSN=${CISS_DW_DSN:-postgresql+psycopg2://${CISS_POSTGRES_USER:-ciss_dw}:${CISS_POSTGRES_PASSWORD:-ciss_dw}@ciss-postgres:5432/${CISS_POSTGRES_DB:-ciss_dw}}
    volumes:
      - claude-auth:/root/.claude
      - ./config:/workspace/config
      - ./workspace:/workspace/workspace
      - ./dashboard/data:/workspace/dashboard/data
      - ./.claude/agents:/workspace/.claude/agents
      - ./.claude/skills:/workspace/.claude/skills:ro
      - ./.claude/commands:/workspace/.claude/commands:ro
      - ./.claude/templates:/workspace/.claude/templates:ro
      - ./memory:/workspace/memory:ro
      - ./ADWs:/workspace/ADWs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    depends_on:
      ciss-postgres:
        condition: service_healthy

  ciss-postgres:
    image: postgres:16-alpine
    container_name: evonexus-ciss-postgres
    environment:
      - POSTGRES_DB=${CISS_POSTGRES_DB:-ciss_dw}
      - POSTGRES_USER=${CISS_POSTGRES_USER:-ciss_dw}
      - POSTGRES_PASSWORD=${CISS_POSTGRES_PASSWORD:-ciss_dw}
      - TZ=America/Sao_Paulo
    volumes:
      - ciss-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Telegram — bot que escuta mensagens via OpenRouter (openclaude)
  telegram:
    build: .
    container_name: evonexus-telegram
    entrypoint: ["claude"]
    command: ["--channels", "plugin:telegram@claude-plugins-official", "--dangerously-skip-permissions"]
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - IS_SANDBOX=1
      - CLAUDE_CODE_USE_OPENAI=1
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-moonshotai/kimi-k2.6}
    volumes:
      - daily-logs:/workspace/workspace/daily-logs
      - projects:/workspace/workspace/projects
      - community:/workspace/workspace/community
      - financial:/workspace/workspace/finance
      - personal:/workspace/workspace/personal
      - meetings:/workspace/workspace/meetings
      - strategy:/workspace/workspace/strategy
      - memory:/workspace/memory
      - adw-logs:/workspace/ADWs/logs
      - agent-memory:/workspace/.claude/agent-memory
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Runner on-demand — para executar rotinas manualmente
  # Uso: docker compose run --rm runner ADWs/routines/good_morning.py
  runner:
    build: .
    container_name: evonexus-runner
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - IS_SANDBOX=1
      - CLAUDE_CODE_USE_OPENAI=1
      - OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-moonshotai/kimi-k2.6}
    volumes:
      - daily-logs:/workspace/workspace/daily-logs
      - projects:/workspace/workspace/projects
      - community:/workspace/workspace/community
      - financial:/workspace/workspace/finance
      - personal:/workspace/workspace/personal
      - meetings:/workspace/workspace/meetings
      - strategy:/workspace/workspace/strategy
      - memory:/workspace/memory
      - adw-logs:/workspace/ADWs/logs
      - agent-memory:/workspace/.claude/agent-memory
    profiles:
      - manual

volumes:
  claude-auth:
  daily-logs:
  projects:
  community:
  financial:
  personal:
  meetings:
  strategy:
  memory:
  adw-logs:
  agent-memory:
  ciss-postgres-data:
